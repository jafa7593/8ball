  :root {
    --d: min(94vw, 104vh);         /* triangle width: nearly edge to edge */
    --d: min(94vw, 104dvh);        /* uses the visible height when Safari's toolbar shows */
    --deep: #02030b;
    --mid: #060b2c;
    --blue: #0d1656;
    --core: #1a2b8f;
    --ink: #eef1ff;
    --hint: #aab4ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--deep);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }

  .pool {
    position: fixed;
    inset: 0;
    overflow: hidden;
    cursor: pointer;
    outline: none;
  }

  /* ---------- Liquid ---------- */
  .slosh {
    position: absolute;
    inset: -25%;
    will-change: transform;
  }
  .slosh.go { animation: slosh 0.9s cubic-bezier(.36,.07,.19,.97); }
  @keyframes slosh {
    0%   { transform: translate(0,0) rotate(0); }
    14%  { transform: translate(-6%, -3%) rotate(-5deg); }
    30%  { transform: translate(6%, 2%) rotate(4deg); }
    46%  { transform: translate(-4%, 2%) rotate(-3deg); }
    62%  { transform: translate(3%, -1%) rotate(2deg); }
    80%  { transform: translate(-1%, 0) rotate(-1deg); }
    100% { transform: translate(0,0) rotate(0); }
  }
  .liquid {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 47%,
      var(--core) 0, var(--blue) 20vmax, var(--mid) 42vmax, var(--deep) 72vmax);
  }
  .caustic {
    position: absolute;
    border-radius: 50%;
    filter: blur(40px);
    opacity: 0.55;
    mix-blend-mode: screen;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .caustic.a {
    width: 60vmax; height: 40vmax; left: 15%; top: 20%;
    background: radial-gradient(closest-side, rgba(60,90,230,0.35), transparent);
  }
  .caustic.b {
    width: 50vmax; height: 50vmax; right: 10%; bottom: 15%;
    background: radial-gradient(closest-side, rgba(40,60,180,0.3), transparent);
    animation-duration: 23s;
    animation-delay: -7s;
  }
  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(8%, -6%) scale(1.12); }
    100% { transform: translate(-6%, 5%) scale(0.92); }
  }

  /* ---------- Bubbles ---------- */
  .bubbles { position: absolute; inset: 0; pointer-events: none; }
  .bubble {
    position: absolute;
    bottom: -6vmin;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(205,218,255,0.6), rgba(120,140,255,0.16) 60%, transparent 72%);
    animation: rise linear forwards;
  }
  @keyframes rise {
    0%   { transform: translate(0, 0); opacity: 0; }
    12%  { opacity: 0.75; }
    100% { transform: translate(var(--dx), -115vh); opacity: 0; }
  }

  /* ---------- Triangle ---------- */
  .center {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .glow {
    position: absolute;
    width: calc(var(--d) * 1.25);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(80,110,255,0.28), rgba(80,110,255,0.08) 55%, transparent);
    transition: opacity 0.8s ease;
  }
  .pool:not(.started) .glow { animation: pulse 2.6s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { transform: scale(0.85); opacity: 0.55; }
    50%      { transform: scale(1.05); opacity: 1; }
  }

  .die-wrap {
    position: relative;
    width: var(--d);
    animation: bob 5s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translate(0, 1.2%) rotate(-1.5deg); }
    50%      { transform: translate(0, -1.2%) rotate(1.5deg); }
  }
  .die {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 0.87;
    transition: opacity 0.7s ease, transform 0.9s cubic-bezier(.2,.8,.2,1), filter 0.9s ease;
    filter: drop-shadow(0 0 calc(var(--d) * 0.03) rgba(70,100,255,0.6));
  }
  .die.sunk {
    opacity: 0;
    transform: translateY(22%) scale(0.5) rotate(-14deg);
    filter: blur(9px) drop-shadow(0 0 0 rgba(0,0,0,0));
  }
  .tri {
    position: absolute;
    inset: 0;
    clip-path: polygon(50% 100%, 0 0, 100% 0);
    background: linear-gradient(180deg, #5873ff 0%, #2c44d6 100%);
  }
  .tri::before {
    content: "";
    position: absolute;
    left: 6.5%; right: 6.5%; top: 4%; bottom: 9%;
    clip-path: polygon(50% 100%, 0 0, 100% 0);
    background: linear-gradient(180deg, #2a42d4 0%, #1a2a9e 70%, #142280 100%);
  }
  .answer-box {
    position: absolute;
    left: 21%; right: 21%;
    top: 7%;
    height: 39%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .answer {
    display: block;
    width: 100%;
    color: var(--ink);
    font-family: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", -apple-system, sans-serif;
    text-transform: uppercase;
    font-weight: 600;
    letter-spacing: 0.04em;
    line-height: 1.02;
    text-shadow: 0 0 8px rgba(170,190,255,0.7);
  }

  /* ---------- Depth ---------- */
  .murk {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle at 50% 47%, transparent 28vmax, rgba(2,3,11,0.5) 48vmax, rgba(1,2,8,0.92) 75vmax);
  }

  /* ---------- Text & controls ---------- */
  .hint {
    position: absolute;
    left: 0; right: 0;
    bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    padding: 0 16px;
    text-align: center;
    color: var(--hint);
    font-size: max(13px, min(3.6vw, 2.2vh));
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.6;
    transition: opacity 0.4s;
    pointer-events: none;
  }


  @media (prefers-reduced-motion: reduce) {
    .slosh.go, .caustic, .die-wrap, .pool:not(.started) .glow { animation: none; }
  }
</style>
</head>
<body>
  <div class="pool" id="pool" role="button" tabindex="0" aria-label="Tap anywhere for an answer">
    <div class="slosh" id="slosh">
      <div class="liquid"></div>
      <div class="caustic a"></div>
      <div class="caustic b"></div>
    </div>
    <div class="bubbles" id="bubbles"></div>
    <div class="center">
      <div class="glow"></div>
      <div class="die-wrap">
        <div class="die sunk" id="die">
          <div class="tri"></div>
          <div class="answer-box" id="answerBox">
            <span class="answer" id="answer" aria-live="polite"></span>
          </div>
        </div>
      </div>
    </div>
    <div class="murk"></div>
    <div class="hint" id="hint">Ask a question · tap anywhere</div>
  </div>

<script>
(() => {
  const answers = [
    "It is certain", "It is decidedly so", "Without a doubt", "Yes, definitely",
    "You may rely on it", "As I see it, yes", "Most likely", "Outlook good",
    "Yes", "Signs point to yes",
    "Reply hazy, try again", "Ask again later", "Better not tell you now",
    "Cannot predict now", "Concentrate and ask again",
    "Don't count on it", "My reply is no", "My sources say no",
    "Outlook not so good", "Very doubtful"
  ];

  const $ = (id) => document.getElementById(id);
  const pool = $("pool"), slosh = $("slosh"), die = $("die");
  const answerEl = $("answer"), answerBox = $("answerBox");
  const bubblesEl = $("bubbles"), hint = $("hint");

  let shown = false, busy = false, last = -1;

  function pick() {
    let i;
    do { i = Math.floor(Math.random() * answers.length); } while (i === last);
    last = i;
    return answers[i];
  }

  // Fit text inside the triangle
  function fit() {
    const maxH = answerBox.clientHeight, maxW = answerBox.clientWidth;
    if (!maxH || !maxW) return;
    let size = maxH * 0.42;
    answerEl.style.fontSize = size + "px";
    while (size > 6 && (answerEl.offsetHeight > maxH || answerEl.scrollWidth > maxW)) {
      size -= 0.5;
      answerEl.style.fontSize = size + "px";
    }
  }
  window.addEventListener("resize", fit);
  try { document.fonts.ready.then(fit); } catch (e) {}

  // Bubbles
  function bubble(burst) {
    const b = document.createElement("span");
    b.className = "bubble";
    const vmin = Math.min(innerWidth, innerHeight) / 100;
    const size = (burst ? 1.2 + Math.random() * 3.2 : 0.8 + Math.random() * 2.4) * vmin;
    b.style.width = b.style.height = size + "px";
    b.style.left = (burst ? 25 + Math.random() * 50 : Math.random() * 100) + "%";
    b.style.setProperty("--dx", ((Math.random() - 0.5) * 60) + "px");
    b.style.animationDuration = (burst ? 1.1 + Math.random() * 1.2 : 6 + Math.random() * 6) + "s";
    b.addEventListener("animationend", () => b.remove());
    bubblesEl.appendChild(b);
  }
  for (let i = 0; i < 6; i++) setTimeout(() => bubble(false), i * 400);
  setInterval(() => { if (!document.hidden) bubble(false); }, 700);

  // Main action
  function ask() {
    if (busy) return;
    busy = true;
    pool.classList.add("started");

    try { if (navigator.vibrate) navigator.vibrate([40, 40, 60]); } catch (e) {}

    slosh.classList.remove("go");
    void slosh.offsetWidth;
    slosh.classList.add("go");
    for (let i = 0; i < 22; i++) setTimeout(() => bubble(true), i * 30);

    const next = pick();
    hint.style.opacity = 0;

    if (!shown) {
      shown = true;
      answerEl.textContent = next;
      fit();
      setTimeout(() => die.classList.remove("sunk"), 450);
      setTimeout(done, 1300);
    } else {
      die.classList.add("sunk");
      setTimeout(() => { answerEl.textContent = next; fit(); }, 700);
      setTimeout(() => die.classList.remove("sunk"), 850);
      setTimeout(done, 1650);
    }
  }

  function done() {
    busy = false;
  }

  pool.addEventListener("click", () => { enableMotion(); ask(); });
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); ask(); }
  });

  // Shake the phone to ask
  let motionOn = false, lastShake = 0;
  function onMotion(e) {
    const a = e.acceleration;
    let mag;
    if (a && a.x != null) {
      mag = Math.hypot(a.x, a.y, a.z);
    } else if (e.accelerationIncludingGravity) {
      const g = e.accelerationIncludingGravity;
      mag = Math.abs(Math.hypot(g.x || 0, g.y || 0, g.z || 0) - 9.81);
    } else return;
    const now = Date.now();
    if (mag > 16 && now - lastShake > 1800) { lastShake = now; ask(); }
  }
  function enableMotion() {
    if (motionOn || typeof DeviceMotionEvent === "undefined") return;
    motionOn = true;
    try {
      if (typeof DeviceMotionEvent.requestPermission === "function") {
        DeviceMotionEvent.requestPermission()
          .then((r) => { if (r === "granted") window.addEventListener("devicemotion", onMotion); })
          .catch(() => {});
      } else {
        window.addEventListener("devicemotion", onMotion);
      }
    } catch (e) {}
  }
  if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission !== "function") {
    enableMotion();
  }
})();
</script>
</body>
</html>
